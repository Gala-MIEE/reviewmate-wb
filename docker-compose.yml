services:
  web:
    build: .
    command: gunicorn -w 2 -b 0.0.0.0:8000 web:app
    env_file: .env
    environment: [DB_PATH=/app/data/reviewmate.db]
    volumes: [./data:/app/data]
    ports: ["8000:8000"]
    restart: unless-stopped
  worker:
    build: .
    command: python worker.py
    env_file: .env
    environment: [DB_PATH=/app/data/reviewmate.db]
    volumes: [./data:/app/data]
    restart: unless-stopped
